<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블로그 보관함 · 착한언니복덕방</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1c1c1a;--sub:#7a766c;--line:#e7e3d9;--navy:#1E2A3A;--y:#FFD84D;--pk:#ff2d8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:820px;margin:0 auto;padding:20px 16px 80px}
a.back{font-size:14px;color:var(--sub);text-decoration:none}
h1{font-size:24px;margin:10px 0 4px}.sub{color:var(--sub);font-size:13px;line-height:1.5}
.sum{display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap}.sum div{flex:1;min-width:90px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chips button{flex:none;font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chips button.on{background:var(--y);border-color:var(--y);font-weight:700}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.it.done{opacity:.6}
.ck{flex:none;margin-top:3px;width:22px;height:22px;accent-color:var(--navy)}
.bx{flex:1;min-width:0}.t{font-weight:800;font-size:16px;line-height:1.4}
.best{font-size:13px;color:#555;margin-top:4px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}.b{padding:3px 9px;border-radius:99px;background:#f0eee8;color:#555}
.st{font-weight:700}.st0{background:#FFE3EF;color:#b0105a}.st1{background:#E3F4F7;color:#11606e}.st2{background:#FFF1C2;color:#7a5a00}.st3{background:#E3ECFA;color:#26467a}.st4{background:#DFF3E4;color:#1f6b3a}.st5{background:#FBE0DD;color:#9b2c20}
.memo{font-size:13px;color:#6b665c;margin-top:6px}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.act a,.act button{font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.act a.go{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
details{margin-top:8px;font-size:13px;color:#555}details li{margin:3px 0}
.note{font-size:12px;color:var(--sub);margin-top:24px;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;display:none}
</style></head><body><div class="w">
<a class="back" href="../../">← 대시보드</a>
<h1>📝 블로그 보관함</h1>
<div class="sub">초안을 한눈에 보고, 올린 글은 ☑ 체크해 두세요. 제목 복사·붙여넣기 페이지로 바로 가요.</div>
<div class="sum" id="sum"></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="note">☑ 체크는 <b>이 기기 브라우저에만</b> 저장돼요 (폰과 PC가 따로예요).<br>모든 기기에 남기려면 Claude에게 "○○ 글 발행했어"라고 말해 주세요 → <code>naver/library/status.json</code>에 기록돼요.</div>
</div><div class="toast" id="toast">복사했어요</div>
<script>
const ORDER=["발행 예정","사진 완료","사진 필요","초안","발행 완료","보류"];
let D=[],S={},F="전체";
const LS="gs-blog-published";
function loc(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return {}}}
function save(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
function stat(d){const l=loc();if(l[d.slug])return "발행 완료";const s=S[d.slug];if(s&&s.status)return s.status;if(d.photos.length)return "사진 필요";return "초안"}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function strip(s){return s.replace(/\*\*/g,"")}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1500)}
function render(){
  const cnt={};D.forEach(d=>{const s=stat(d);cnt[s]=(cnt[s]||0)+1});
  document.getElementById("sum").innerHTML=[["전체",D.length],["발행 예정",cnt["발행 예정"]||0],["사진 필요",cnt["사진 필요"]||0],["발행 완료",cnt["발행 완료"]||0]].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join("");
  const chips=["전체","자이엘라","그랑자이",...ORDER];
  document.getElementById("chips").innerHTML=chips.map(c=>`<button class="${c===F?"on":""}" data-c="${c}">${c}${cnt[c]?" "+cnt[c]:""}</button>`).join("");
  document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{F=b.dataset.c;render()});
  let L=D.slice().sort((a,b)=>ORDER.indexOf(stat(a))-ORDER.indexOf(stat(b))||b.slug.localeCompare(a.slug));
  if(F==="자이엘라"||F==="그랑자이")L=L.filter(d=>d.office===F);else if(F!=="전체")L=L.filter(d=>stat(d)===F);
  const l=loc();
  document.getElementById("list").innerHTML=L.map(d=>{const s=stat(d),m=S[d.slug]||{};
    return `<div class="it ${s==="발행 완료"?"done":""}"><input type="checkbox" class="ck" data-s="${d.slug}" ${s==="발행 완료"?"checked":""} title="발행했어요">
    <div class="bx"><div class="t">${d.series?`<span style="color:#ff2d8a">${esc(d.series)}</span> `:""}${esc(d.title)}</div><div class="best">${esc(strip(d.best))}</div>
    <div class="meta"><span class="b st st${ORDER.indexOf(s)}">${s}</span>${m.date?`<span class="b">📅 ${m.date}</span>`:""}<span class="b">${d.office||"-"}점</span>${d.images?`<span class="b">🖼 사진 ${d.images}장 들어감</span>`:""}${d.photos.length?`<span class="b">📷 찍을 것 ${d.photos.length}</span>`:""}${d.note_todo?`<span class="b" style="background:#ffe3ef;color:#b0105a">📝 현장 노트 필요</span>`:""}${d.fills?`<span class="b">✍️ 채울 칸 ${d.fills}</span>`:""}</div>
    ${m.memo?`<div class="memo">💬 ${esc(m.memo)}</div>`:""}
    <div class="act"><a class="go" href="../../${d.file}">📋 붙여넣기 페이지</a><button data-copy="${esc(strip(d.best))}">제목 복사</button>${d.tags?`<button data-copy="${esc(d.tags)}">태그 복사</button>`:""}</div>
    ${d.photos.length?`<details><summary>📷 찍을 사진 보기</summary><ul>${d.photos.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></details>`:""}
    </div></div>`}).join("");
  document.querySelectorAll(".ck").forEach(c=>c.onchange=()=>{const o=loc();if(c.checked)o[c.dataset.s]=new Date().toISOString().slice(0,10);else delete o[c.dataset.s];save(o);render()});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>toast("복사했어요")));
}
Promise.all([fetch("drafts.json").then(r=>r.json()),fetch("status.json").then(r=>r.json()).catch(()=>({posts:{}}))]).then(([d,s])=>{D=d;S=s.posts||{};render()});
</script></body></html>
