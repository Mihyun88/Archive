<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:Pretendard;word-break:keep-all;position:relative;overflow:hidden;color:#fff;text-align:center;
background:radial-gradient(circle at 50% 42%,#1f5a46 0%,#0f3a2d 55%,#0a2a21 100%)}
.glow{position:absolute;left:50%;top:47%;width:900px;height:520px;margin:-260px 0 0 -450px;background:radial-gradient(ellipse,rgba(255,214,120,.22),transparent 65%)}
.label{position:absolute;left:0;right:0;top:170px;font-size:46px;font-weight:600;letter-spacing:14px;color:#cfe9dc}
.line{position:absolute;left:50%;top:250px;width:90px;height:3px;margin-left:-45px;background:#e9c46a;border-radius:2px}
#big{position:absolute;left:0;right:0;top:320px;transform-origin:center}
.max{display:block;font-size:64px;font-weight:300;letter-spacing:6px;color:#e8f3ee;margin-bottom:6px}
.num{display:inline-block;min-width:390px;text-align:right;font-variant-numeric:tabular-nums;font-size:300px;font-weight:800;letter-spacing:-12px;line-height:1;
background:linear-gradient(180deg,#fff6d8 0%,#f3d27a 55%,#d9a93b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
.unit{font-size:120px;font-weight:700;color:#f3d27a;letter-spacing:-2px;margin-left:10px}
.sub{position:absolute;left:0;right:0;bottom:170px;font-size:48px;font-weight:700;letter-spacing:4px}
.sub span{display:inline-block;border:2px solid rgba(233,196,106,.7);border-radius:60px;padding:16px 44px;color:#f7e7b8}
</style></head><body>
<div class="glow"></div>
<div class="label">전세보증료 지원</div>
<div class="line"></div>
<div id="big"><span class="max">최대</span><span class="num" id="n">40</span><span class="unit">만 원</span></div>
<div class="sub"><span>청년·신혼 전액 · 그 외 90%</span></div>
</body></html>
