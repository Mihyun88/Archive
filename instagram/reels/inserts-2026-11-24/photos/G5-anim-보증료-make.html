<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1080px;font-family:Pretendard;word-break:keep-all;background:linear-gradient(160deg,#eaf8ef,#c8edd6);position:relative;overflow:hidden;color:#16233f}
.pill{position:absolute;left:60px;top:70px;background:#137a46;color:#fff;font-weight:800;font-size:44px;padding:16px 34px;border-radius:60px}
h1{position:absolute;left:60px;top:180px;font-size:112px;font-weight:900;line-height:1.12;letter-spacing:-4px}
h1 em{font-style:normal;color:#e2560c}
.rows{position:absolute;left:60px;right:60px;top:470px;display:flex;flex-direction:column;gap:24px}
.r{background:#fff;border-radius:30px;padding:30px 36px;display:flex;align-items:center;gap:28px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.k{flex:none;width:230px;text-align:center;font-size:42px;font-weight:900;color:#fff;border-radius:20px;padding:16px 0}
.k1{background:#137a46}.k2{background:#2a9d63}.k3{background:#103e79}
.v{font-size:54px;font-weight:900}
.v em{font-style:normal;color:#e2560c}
</style></head><body>
<div class="pill">보증보험 가입했다면 꼭!</div>
<h1><span style="font-size:96px">전세 보증료 돌려받기</span><br><span id="big" style="display:inline-block;transform-origin:left center;font-size:132px"><em>최대 40만 원!</em></span></h1>
<div class="rows">
<div class="r"><span class="k k1">청년·신혼</span><span class="v"><em>전액</em> 지원</span></div>
<div class="r"><span class="k k2">그 외</span><span class="v"><em>90%</em> 지원</span></div>
<div class="r"><span class="k k3">신청</span><span class="v">정부24 · 구청</span></div>
</div>
</body></html>
