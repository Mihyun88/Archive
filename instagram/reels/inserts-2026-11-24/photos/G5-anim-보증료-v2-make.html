<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1080px;font-family:Pretendard;word-break:keep-all;background:#137a46;position:relative;overflow:hidden;color:#fff;text-align:center}
.rays{position:absolute;left:50%;top:56%;width:1800px;height:1800px;margin:-900px 0 0 -900px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);border-radius:50%}
.top{position:absolute;left:0;right:0;top:90px;font-size:64px;font-weight:900}
.top em{font-style:normal;color:#ffe066}
#big{position:absolute;left:0;right:0;top:250px;transform-origin:center center}
.num{display:inline-block;background:#ffd84d;color:#d9480f;font-size:270px;font-weight:900;letter-spacing:-10px;line-height:1;padding:40px 60px 50px;border-radius:60px;box-shadow:0 20px 0 #c99a00}
.max{display:block;font-size:80px;font-weight:900;color:#fff;margin-bottom:18px;letter-spacing:-2px}
.bot{position:absolute;left:0;right:0;bottom:110px;font-size:60px;font-weight:900}
.bot em{font-style:normal;color:#ffe066}
</style></head><body>
<div class="rays"></div>
<div class="top">전세 보증료 <em>돌려받기</em></div>
<div id="big"><span class="max">최대</span><span class="num">40만 원</span></div>
<div class="bot">청년·신혼 <em>전액</em> · 그 외 <em>90%</em></div>
</body></html>
