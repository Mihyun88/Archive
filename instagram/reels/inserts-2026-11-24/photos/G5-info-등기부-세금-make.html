<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1080px;background:#e9edf2;position:relative;overflow:hidden;font-family:Pretendard}
.paper{position:absolute;left:70px;top:70px;right:70px;bottom:70px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.18);padding:56px 56px;font-family:'Nanum Myeongjo',serif;color:#222}
.t{text-align:center;font-size:40px;font-weight:800;letter-spacing:6px;margin-bottom:10px}
.ad{text-align:center;font-size:26px;color:#444;margin-bottom:34px}
.sec{border:2px solid #333;margin-bottom:26px}
.sh{background:#f2f2f2;border-bottom:2px solid #333;text-align:center;font-size:30px;font-weight:800;padding:14px}
.sh span{font-weight:400;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:22px}
th{border-bottom:1px solid #333;border-right:1px solid #333;padding:10px;background:#fafafa;font-weight:700}
th:last-child,td:last-child{border-right:0}
td{border-right:1px solid #333;padding:14px 10px;text-align:center}
.none{font-size:64px;font-weight:800;text-align:center;padding:80px 0 70px;color:#1a1a1a}
.hl{background:linear-gradient(transparent 55%,#e8e8e8 55%);padding:0 8px}
.stamp{position:absolute;right:60px;bottom:120px;transform:rotate(-8deg);border:8px solid #d62828;color:#d62828;text-align:center;line-height:1.15;border-radius:24px;padding:16px 34px;font-family:Pretendard;font-weight:900;font-size:64px;background:rgba(255,255,255,.92)}
.ex{position:absolute;left:56px;bottom:40px;font-family:Pretendard;font-size:24px;font-weight:700;color:#e2560c;border:3px solid #e2560c;border-radius:12px;padding:6px 14px}
</style></head><body>
<div class="paper">
<div class="t">등기사항전부증명서</div>
<div class="ad">[집합건물] 서울특별시 ○○구 ○○동 ○○빌라 제201호</div>
<div class="sec"><div class="sh">【 갑 구 】 <span>( 소유권에 관한 사항 )</span></div>
<table><tr><th>순위번호</th><th>등기목적</th><th>권리자 및 기타사항</th></tr>
<tr><td>1</td><td>소유권보존</td><td>소유자 김○○</td></tr></table></div>
<div class="sec"><div class="sh">【 을 구 】 <span>( 소유권 이외의 권리에 관한 사항 )</span></div>
<div class="none"><span class="hl">근저당권 없음</span><div style="font-size:30px;font-weight:400;color:#555;margin-top:18px">( 기록사항 없음 )</div></div></div>
<div class="ex">예시 이미지</div>
</div>
<div class="stamp">밀린 세금은<br>여기 안 나와요 ✗</div>
</body></html>
