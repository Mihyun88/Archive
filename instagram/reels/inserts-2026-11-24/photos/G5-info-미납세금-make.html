<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1080px;font-family:Pretendard;word-break:keep-all;background:linear-gradient(160deg,#fff1ee,#ffd9cf);position:relative;overflow:hidden;color:#16233f}
.pill{position:absolute;left:60px;top:70px;background:#b3261e;color:#fff;font-weight:800;font-size:44px;padding:16px 34px;border-radius:60px}
h1{position:absolute;left:60px;top:180px;font-size:112px;font-weight:900;line-height:1.12;letter-spacing:-4px;color:#16233f}
h1 em{font-style:normal;color:#e2560c}
.rows{position:absolute;left:60px;right:60px;top:470px;display:flex;flex-direction:column;gap:24px}
.r{background:#fff;border-radius:30px;padding:30px 36px;display:flex;align-items:center;gap:28px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.k{flex:none;width:190px;text-align:center;font-size:44px;font-weight:900;color:#fff;border-radius:20px;padding:16px 0}
.k1{background:#103e79}.k2{background:#1d7fd6}.k3{background:#e2560c}
.v{font-size:50px;font-weight:900;line-height:1.2}
.v em{font-style:normal;color:#e2560c}
</style></head><body>
<div class="pill">등기부에는 안 나와요!</div>
<h1>집주인 밀린 세금<br><em>세입자도 볼 수 있어요</em></h1>
<div class="rows">
<div class="r"><span class="k k1">국세</span><span class="v">세무서 <em>(전국 어디나)</em></span></div>
<div class="r"><span class="k k2">지방세</span><span class="v">주민센터 · 위택스</span></div>
<div class="r"><span class="k k3">언제</span><span class="v">계약 후 ~ 입주 전<br><em>집주인 동의 없이!</em></span></div>
</div>
</body></html>
