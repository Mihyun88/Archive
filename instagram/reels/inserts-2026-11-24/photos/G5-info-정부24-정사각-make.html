<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1080px;font-family:Pretendard;word-break:keep-all;background:linear-gradient(160deg,#e3f3ff,#bfe3ff);position:relative;overflow:hidden;color:#16233f}
.pill{position:absolute;left:60px;top:60px;background:#103e79;color:#fff;font-weight:800;font-size:46px;padding:16px 36px;border-radius:60px}
h1{position:absolute;left:60px;top:160px;font-size:112px;font-weight:900;line-height:1.1;letter-spacing:-4px;color:#103e79}
h1 em{font-style:normal;color:#f26a1b}
.sub{position:absolute;left:64px;top:430px;font-size:44px;font-weight:700;color:#3d4b66}
.sub b{color:#103e79}
.grid{position:absolute;left:60px;right:60px;top:520px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.st{background:#fff;border-radius:28px;padding:26px 28px;display:flex;align-items:center;gap:22px;box-shadow:0 8px 22px rgba(16,62,121,.13);min-height:150px}
.st i{flex:none;font-style:normal;width:70px;height:70px;border-radius:50%;background:#2f6fe4;color:#fff;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.st b{font-size:44px;font-weight:900;line-height:1.2}
.st.go{background:#2f6fe4;color:#fff}.st.go i{background:#fff;color:#2f6fe4}
.tip{position:absolute;left:60px;right:60px;bottom:80px;background:#ffd84d;border-radius:28px;padding:26px;text-align:center;font-size:50px;font-weight:900;color:#103e79}
.tip em{font-style:normal;color:#e2560c}
.brand{position:absolute;right:60px;bottom:24px;font-size:26px;font-weight:800;color:#103e79;opacity:.8}
.note{position:absolute;left:62px;bottom:28px;font-size:22px;color:#6b7891}
</style></head><body>
<div class="pill">주민센터 안 가도 돼요!</div>
<h1>전입신고는<br><em>정부24 「전입신고+」</em></h1>
<p class="sub">이사한 날부터 <b>14일 이내</b> · 온라인 신청</p>
<div class="grid">
<div class="st"><i>1</i><b>정부24<br>로그인</b></div>
<div class="st"><i>2</i><b>민원서비스</b></div>
<div class="st"><i>3</i><b>원스톱·생애주기<br>꾸러미 서비스</b></div>
<div class="st go"><i>4</i><b>전입신고+<br>신청하기 👆</b></div>
</div>
<div class="tip">잔금날 평일에 <em>바로 신고!</em></div>
<div class="note">대항력 = 전입신고 + 입주 다음 날 0시</div>
<div class="brand">착한언니복덕방</div>
</body></html>
