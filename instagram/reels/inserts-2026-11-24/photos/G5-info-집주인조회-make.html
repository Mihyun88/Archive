<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1080px;font-family:Pretendard;word-break:keep-all;background:linear-gradient(160deg,#eef0ff,#cfd6ff);position:relative;overflow:hidden;color:#16233f}
.pill{position:absolute;left:60px;top:70px;background:#3b3fa8;color:#fff;font-weight:800;font-size:44px;padding:16px 34px;border-radius:60px}
.icon{position:absolute;right:60px;top:60px;width:230px;height:230px;border-radius:52px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.18);background:#fff}
.icon img{width:124%;height:124%;margin:-12%;object-fit:cover}
h1{position:absolute;left:60px;top:190px;font-size:108px;font-weight:900;line-height:1.12;letter-spacing:-4px}
h1 em{font-style:normal;color:#e2560c}
.steps{position:absolute;left:60px;right:60px;top:480px;display:flex;flex-direction:column;gap:22px}
.st{background:#fff;border-radius:30px;padding:30px 36px;display:flex;gap:28px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.st i{flex:none;font-style:normal;width:80px;height:80px;border-radius:50%;background:#3b3fa8;color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center}
.st b{font-size:52px;font-weight:900;line-height:1.2}
.st b em{font-style:normal;color:#e2560c}
</style></head><body>
<div class="pill">얼굴 말고 기록을 보세요!</div>
<div class="icon"><img src="app-icon-hug.jpg"></div>
<h1>집주인<br><em>보증사고 이력</em> 조회</h1>
<div class="steps">
<div class="st"><i>1</i><b>안심 조회 → 안심임대인 조회</b></div>
<div class="st"><i>2</i><b>휴대폰 <em>본인인증만</em> 하면 OK</b></div>
<div class="st"><i>3</i><b><em>보증사고 · 보증금지</em> 여부 확인</b></div>
</div>
</body></html>
