<html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Pretendard;word-break:keep-all;background:#888}
.c{width:1080px;height:1080px;position:relative;overflow:hidden;margin-bottom:10px}
.kb{background:linear-gradient(160deg,#fff8e1,#ffe39a);color:#4a4038}.hug{background:linear-gradient(160deg,#e3f3ff,#bfe3ff);color:#103e79}
.icon{position:absolute;right:60px;top:60px;width:250px;height:250px;border-radius:56px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.18);background:#fff}
.icon img{width:124%;height:124%;margin:-12%;object-fit:cover}
.pill{position:absolute;left:60px;top:70px;color:#fff;font-weight:800;font-size:44px;padding:16px 34px;border-radius:60px}
.kb .pill{background:#5b4f45}.hug .pill{background:#103e79}
h1{position:absolute;left:60px;top:190px;font-size:120px;font-weight:900;line-height:1.1;letter-spacing:-4px}
h1 em{font-style:normal}.kb h1 em{color:#e6a700}.hug h1 em{color:#1d7fd6}
.steps{position:absolute;left:60px;right:60px;top:540px;display:flex;flex-direction:column;gap:32px}
.st{background:#fff;border-radius:30px;padding:36px 38px;display:flex;gap:28px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.st i{flex:none;font-style:normal;width:80px;height:80px;border-radius:50%;color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center}
.kb .st i{background:#e6a700}.hug .st i{background:#1d7fd6}
.st b{font-size:52px;font-weight:900;line-height:1.2;color:#16233f}
.st b em{font-style:normal}.kb .st b em{color:#d08a00}.hug .st b em{color:#e2560c}
</style></head><body>
<div class="c kb" id="kb">
<div class="pill">빌라는 시세가 없다? NO!</div>
<div class="icon"><img src="app-icon-kb.jpg"></div>
<h1>빌라도 이제<br><em>KB시세</em>로 확인!</h1>
<div class="steps">
<div class="st"><i>1</i><b>KB부동산 앱 → 주소 검색</b></div>
<div class="st"><i>2</i><b><em>빌라 시세</em> 바로 확인</b></div>
<div class="st"><i>3</i><b>안심전세 앱으로 <em>한 번 더!</em></b></div>
</div>
</div>
<div class="c hug" id="hug">
<div class="pill">KB시세 보고 한 번 더!</div>
<div class="icon"><img src="app-icon-hug.jpg"></div>
<h1>안심전세 앱<br><em>위험성 진단</em></h1>
<div class="steps">
<div class="st"><i>1</i><b>시세조회&위험성진단</b></div>
<div class="st"><i>2</i><b>내 전세 보증금 입력</b></div>
<div class="st"><i>3</i><b><em>경매 예상가</em>보다 높으면 위험!</b></div>
</div>
</div>
</body></html>
